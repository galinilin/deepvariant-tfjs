<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepVariant sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ccc;
        font-family: 'Inconsolata', ui-monospace, Menlo, monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #sketch-top {
        flex: 0 0 66%;
        position: relative;
      }
      #sketch-bottom {
        flex: 1 1 34%;
        border-top: 1px solid #1a1a1a;
        position: relative;
      }
      canvas {
        display: block;
      }
      .reset-btn {
        position: fixed;
        bottom: 16px;
        right: 16px;
        padding: 6px 12px;
        background: #000;
        color: #ccc;
        border: 1px solid #2a2a2a;
        font-family: 'Inconsolata', ui-monospace, Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        z-index: 10;
        user-select: none;
      }
      .reset-btn:hover {
        color: #fff;
        border-color: #3a3a3a;
      }
    </style>
  </head>
  <body>
    <div id="sketch-top"></div>
    <div id="sketch-bottom"></div>
    <button id="reset-view" class="reset-btn" type="button">Reset view</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
