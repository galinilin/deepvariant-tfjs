<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepVariant sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #ccc;
        font-family: 'Inconsolata', ui-monospace, Menlo, monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #sketch-top {
        flex: 0 0 66%;
        position: relative;
      }
      #sketch-bottom {
        flex: 1 1 34%;
        border-top: 1px solid #1a1a1a;
        position: relative;
      }
      canvas {
        display: block;
      }
      .corner-buttons {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      .reset-btn {
        padding: 6px 12px;
        background: #000;
        color: #ccc;
        border: 1px solid #2a2a2a;
        font-family: 'Inconsolata', ui-monospace, Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .reset-btn:hover {
        color: #fff;
        border-color: #3a3a3a;
      }
      .tooltip {
        position: fixed;
        background: #0a0a0a;
        border: 1px solid #2a2a2a;
        color: #ededed;
        padding: 10px 13px;
        font-family: 'Inconsolata', ui-monospace, Menlo, monospace;
        font-size: 14px;
        line-height: 1.55;
        pointer-events: none;
        z-index: 100;
        display: none;
        white-space: nowrap;
        max-width: 440px;
      }
      .tooltip .section {
        padding: 4px 0;
      }
      .tooltip .section + .section {
        border-top: 1px solid #232323;
        margin-top: 4px;
        padding-top: 6px;
      }
      .tooltip .section-label {
        color: #909090;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .tooltip .row-id {
        color: #fff;
        letter-spacing: 0.04em;
      }
      .tooltip .muted {
        color: #aaa;
      }
      .tooltip .supports-yes {
        color: #ffdc6e;
      }
      .tooltip .supports-no {
        color: #c0c0c0;
      }
      .tooltip .ins-seq {
        color: #b88add;
      }
    </style>
  </head>
  <body>
    <div id="sketch-top"></div>
    <div id="sketch-bottom"></div>
    <div class="corner-buttons">
      <button id="verify-golden" class="reset-btn" type="button">Verify golden</button>
      <button id="inspect-golden" class="reset-btn" type="button">Inspect golden</button>
      <button id="randomize" class="reset-btn" type="button">Randomize</button>
      <button id="reset-view" class="reset-btn" type="button">Reset view</button>
    </div>
    <div id="read-tooltip" class="tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
